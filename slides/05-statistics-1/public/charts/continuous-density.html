<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; }
  #plot { width: 100%; height: 100%; min-height: 200px; }
</style>
</head>
<body>

<div id="plot"></div>

<script>
function pdf(x, mu, sigma) {
  const z = (x - mu) / sigma;
  return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
}

const mu = 0, sigma = 1;
const xLine = [], yLine = [];
for (let x = -3.5; x <= 3.5; x += 0.05) {
  xLine.push(x);
  yLine.push(pdf(x, mu, sigma));
}

// Shaded region a, b
const a = -0.5, b = 1.2;
const xShade = [a], yShade = [0];
for (let x = a; x <= b; x += 0.02) {
  xShade.push(x);
  yShade.push(pdf(x, mu, sigma));
}
xShade.push(b); yShade.push(0);

Plotly.newPlot('plot', [
  {
    x: xShade, y: yShade,
    type: 'scatter', mode: 'lines',
    fill: 'toself',
    fillcolor: 'rgba(255, 0, 255, 0.22)',
    line: { color: 'rgba(255, 0, 255, 0)' },
    hoverinfo: 'skip',
    name: 'area'
  },
  {
    x: xLine, y: yLine,
    type: 'scatter', mode: 'lines',
    line: { color: '#1A1A1A', width: 2 },
    hoverinfo: 'skip',
    name: 'density f(x)'
  }
], {
  margin: { l: 60, r: 30, t: 50, b: 50 },
  xaxis: {
    title: 'value x',
    tickmode: 'array',
    tickvals: [a, b],
    ticktext: ['a', 'b'],
    gridcolor: '#EEEEEE',
    zeroline: false
  },
  yaxis: {
    title: { text: 'density f(x)', standoff: 8 },
    gridcolor: '#EEEEEE',
    zeroline: false,
    showticklabels: false
  },
  plot_bgcolor: '#FAFAFA',
  paper_bgcolor: '#FFFFFF',
  showlegend: false,
  font: { family: 'Inter, system-ui, sans-serif', size: 12, color: '#1A1A1A' },
  annotations: []
}, { displayModeBar: false, responsive: true });
</script>

</body>
</html>
