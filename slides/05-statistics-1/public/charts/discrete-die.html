<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; }
  #plot { width: 100%; height: 100%; min-height: 200px; }
</style>
</head>
<body>

<div id="plot"></div>

<script>
const x = [1, 2, 3, 4, 5, 6];
const y = [1/6, 1/6, 1/6, 1/6, 1/6, 1/6];

Plotly.newPlot('plot', [
  {
    x: x, y: y, type: 'bar',
    marker: { color: '#1A1A1A' },
    width: 0.7,
    hovertemplate: 'P(X = %{x}) = 1/6<extra></extra>'
  }
], {
  margin: { l: 60, r: 30, t: 30, b: 50 },
  xaxis: {
    title: 'value x',
    tickmode: 'array',
    tickvals: [1, 2, 3, 4, 5, 6],
    gridcolor: '#EEEEEE',
    zeroline: false
  },
  yaxis: {
    title: 'P(X = x)',
    range: [0, 0.25],
    tickvals: [0, 1/6],
    ticktext: ['0', '1/6'],
    gridcolor: '#EEEEEE',
    zeroline: false
  },
  plot_bgcolor: '#FAFAFA',
  paper_bgcolor: '#FFFFFF',
  showlegend: false,
  font: { family: 'Inter, system-ui, sans-serif', size: 12, color: '#1A1A1A' }
}, { displayModeBar: false, responsive: true });
</script>

</body>
</html>
