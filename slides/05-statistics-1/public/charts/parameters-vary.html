<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; }
  #plot { width: 100%; height: 100%; min-height: 200px; }
</style>
</head>
<body>

<div id="plot"></div>

<script>
function normalPdf(x, mu, sigma) {
  const z = (x - mu) / sigma;
  return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
}

const xs = [];
const y1 = []; // sigma=1
const y2 = []; // sigma=2
for (let x = -7; x <= 7; x += 0.05) {
  xs.push(x);
  y1.push(normalPdf(x, 0, 1));
  y2.push(normalPdf(x, 0, 2));
}

Plotly.newPlot('plot', [
  {
    x: xs, y: y1, type: 'scatter', mode: 'lines',
    line: { color: '#1A1A1A', width: 2 },
    name: 'Normal(μ=0, σ=1)',
    hoverinfo: 'skip'
  },
  {
    x: xs, y: y2, type: 'scatter', mode: 'lines',
    line: { color: '#FF00FF', width: 2 },
    name: 'Normal(μ=0, σ=2)',
    hoverinfo: 'skip'
  }
], {
  margin: { l: 50, r: 20, t: 26, b: 46 },
  xaxis: { title: 'x', gridcolor: '#EEEEEE', zeroline: false },
  yaxis: { title: { text: 'density f(x)', standoff: 6 }, gridcolor: '#EEEEEE', zeroline: false, showticklabels: false },
  plot_bgcolor: '#FAFAFA',
  paper_bgcolor: '#FFFFFF',
  showlegend: true,
  legend: { x: 0.62, y: 0.98, font: { family: 'JetBrains Mono', size: 11, color: '#1A1A1A' }, bgcolor: 'rgba(255,255,255,0.7)' },
  font: { family: 'Inter, system-ui, sans-serif', size: 11, color: '#1A1A1A' }
}, { displayModeBar: false, responsive: true });
</script>

</body>
</html>
