<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; }
  .controls { padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border-bottom: 1px solid #E0E0E0; }
  .group { display: flex; align-items: center; gap: 5px; }
  .controls label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: #6B6B6B; }
  button { font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; padding: 5px 11px; border: 1px solid #1A1A1A; background: #FFFFFF; color: #1A1A1A; cursor: pointer; letter-spacing: 0.06em; }
  button:hover { background: #1A1A1A; color: #FFFFFF; }
  button.active { background: #FF00FF; color: #FFFFFF; border-color: #FF00FF; }
  button.primary { background: #FF00FF; color: #FFFFFF; border-color: #FF00FF; }
  button.primary:hover { background: #1A1A1A; border-color: #1A1A1A; }
  #plot { width: 100%; height: 100%; min-height: 200px; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #6B6B6B; margin-left: auto; }
</style>
</head>
<body>

<div class="controls">

  <div class="group">
    <label>Experiment</label>
    <button id="b-die"  class="exp active" onclick="setExp('die')">fair die</button>
    <button id="b-coin" class="exp"        onclick="setExp('coin')">fair coin</button>
    <button id="b-conv" class="exp"        onclick="setExp('conv')">conversion p=0.30</button>
  </div>

  <div class="group">
    <button class="primary" onclick="generate(1)">+1 outcome</button>
    <button onclick="generate(100)">+100</button>
    <button onclick="generate(10000)">+10 000</button>
    <button onclick="reset()">reset</button>
  </div>

  <span class="status" id="status">trials: 0</span>

</div>

<div id="plot"></div>

<script>
let currentExp = 'die';
const allCounts = {};

const experiments = {
  die:  { values: ['1','2','3','4','5','6'], theoretical: [1/6,1/6,1/6,1/6,1/6,1/6], sample: () => String(Math.floor(Math.random()*6)+1) },
  coin: { values: ['heads','tails'],         theoretical: [0.5, 0.5],                sample: () => (Math.random() < 0.5 ? 'heads' : 'tails') },
  conv: { values: ['converted','not converted'], theoretical: [0.30, 0.70],          sample: () => (Math.random() < 0.30 ? 'converted' : 'not converted') }
};

function ensureCounts(name) {
  if (!allCounts[name]) {
    allCounts[name] = {};
    experiments[name].values.forEach(v => allCounts[name][v] = 0);
  }
}

function reset() {
  allCounts[currentExp] = null;
  ensureCounts(currentExp);
  draw();
}

function setExp(name) {
  currentExp = name;
  document.querySelectorAll('button.exp').forEach(b => b.classList.remove('active'));
  document.getElementById('b-' + name).classList.add('active');
  ensureCounts(name);
  draw();
}

function generate(n) {
  ensureCounts(currentExp);
  const exp = experiments[currentExp];
  for (let i = 0; i < n; i++) {
    const v = exp.sample();
    allCounts[currentExp][v]++;
  }
  draw();
}

function draw() {
  const exp = experiments[currentExp];
  const total = exp.values.reduce((a, v) => a + allCounts[currentExp][v], 0);
  const props = exp.values.map(v => total > 0 ? allCounts[currentExp][v] / total : 0);

  const shapes = exp.values.map((_, i) => ({
    type: 'line',
    x0: i - 0.42, x1: i + 0.42,
    y0: exp.theoretical[i], y1: exp.theoretical[i],
    line: { color: '#FF00FF', dash: 'dash', width: 1.6 }
  }));

  Plotly.newPlot('plot', [{
    x: exp.values, y: props,
    type: 'bar',
    marker: { color: '#1A1A1A' },
    width: 0.6,
    hovertemplate: '%{x}: %{y:.3f}<extra></extra>'
  }], {
    margin: { l: 60, r: 30, t: 26, b: 50 },
    xaxis: { title: 'outcome', gridcolor: '#EEEEEE', zeroline: false },
    yaxis: { title: 'observed proportion', range: [0, 1], gridcolor: '#EEEEEE', zeroline: false },
    shapes,
    plot_bgcolor: '#FAFAFA',
    paper_bgcolor: '#FFFFFF',
    showlegend: false,
    font: { family: 'Inter, system-ui, sans-serif', size: 12, color: '#1A1A1A' }
  }, { displayModeBar: false, responsive: true });

  document.getElementById('status').textContent = 'trials: ' + total;
}

reset();
</script>

</body>
</html>
